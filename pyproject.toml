[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmjax"
version = "0.1.0"
description = "Flow matching for simulation-based inference with JAX"
authors = [
    { name = "Kai Ikuta" }
]
requires-python = ">=3.8"

dependencies = [
    "jax",
    "optax",
    "flax",
    "diffrax",
]

[tool.setuptools.packages.find]
where = ["src"]
